<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الصحيفة السجادية الكاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0f4c3a;--g:#d4af37;--bg:#fdfbf7;--t:#2c2c2c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Amiri',serif;background:var(--bg);color:var(--t);line-height:1.8}
header{background:linear-gradient(135deg,var(--p),#1a6b52);color:#fff;padding:20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 15px rgba(0,0,0,.1)}
header h1{font-size:1.5rem;margin-bottom:5px}
.status{font-size:.8rem;opacity:.9;display:flex;justify-content:center;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.on{background:#4ade80;box-shadow:0 0 5px #4ade80}.off{background:#fbbf24}
.controls{padding:15px;display:flex;gap:10px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);position:sticky;top:75px;z-index:90;border-bottom:1px solid #eee}
input{flex:1;padding:10px 15px;border-radius:25px;border:1px solid #ddd;font-family:inherit;outline:none}
input:focus{border-color:var(--g)}
.btn{padding:8px 16px;border:1px solid var(--p);border-radius:20px;background:transparent;color:var(--p);font-family:inherit;cursor:pointer;white-space:nowrap}
.btn:hover,.btn.active{background:var(--p);color:#fff}
.container{padding:15px;max-width:800px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-right:4px solid var(--g);cursor:pointer;transition:.2s}
.card:active{transform:scale(.98)}
.num{color:var(--g);font-weight:bold;font-size:.9rem;margin-bottom:5px}
.title{font-size:1.3rem;color:var(--p);margin-bottom:8px}
.preview{font-size:.95rem;color:#666;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:200;transform:translateY(100%);transition:.3s ease-in-out;overflow-y:auto;padding:20px}
.modal.open{transform:translateY(0)}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:15px;border-bottom:2px solid var(--g);position:sticky;top:0;background:var(--bg);z-index:10;padding-top:10px}
.close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--p);padding:5px 10px}
.text{font-size:1.4rem;line-height:2.2;text-align:justify;margin-bottom:40px}
.text p{margin-bottom:15px}
.fs-1 .text{font-size:1.1rem;line-height:1.9}
.fs-2 .text{font-size:1.7rem;line-height:2.4}
.fs-3 .text{font-size:2rem;line-height:2.6}
.loader{text-align:center;padding:50px;color:var(--p)}
.spinner{width:40px;height:40px;border:4px solid #eee;border-top:4px solid var(--p);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
@keyframes spin{100%{transform:rotate(360deg)}}
.err{text-align:center;padding:40px;color:#b91c1c}
@media(max-width:600px){header h1{font-size:1.3rem}.text{font-size:1.2rem}}
</style>
</head>
<body>
<header>
<h1>📖 الصحيفة السجادية الكاملة</h1>
<div class="status"><span id="dot" class="dot off"></span><span id="stxt">جاري التحميل...</span></div>
</header>
<div class="controls">
<input type="search" id="search" placeholder="بحث في الأدعية...">
<button class="btn" onclick="chgFont()">Aa</button>
<button class="btn" onclick="reload()">تحديث</button>
</div>
<div class="container" id="app"><div class="loader"><div class="spinner"></div><p>جاري تحميل النصوص الكاملة...</p></div></div>
<div class="modal" id="modal">
<div class="m-head"><h2 id="mTitle" style="color:var(--p);font-size:1.4rem"></h2><button class="close" onclick="closeM()">✕</button></div>
<div id="mText" class="text"></div>
<div style="text-align:center;padding:20px;opacity:.5">❈ صدق الله العلي العظيم ❈</div>
</div>

<script>
// ⚙️ ضع هنا رابط ملف JSON الكامل الذي حملته
// الخيار 1: ملف محلي بجانب الـ HTML (يعمل Offline تماماً)
// الخيار 2: رابط GitHub Raw مباشر
const DATA_SOURCES = [
  './sahifa.json',
  'https://raw.githubusercontent.com/Alsarmad/sahifa-sajjadiya/main/sahifa.json'
];

const CACHE_KEY = 'sahifa_complete_v1';
let prayers = [];
let fsIdx = 0;

document.addEventListener('DOMContentLoaded', init);

async function init() {
  updateStatus();

  // 1. عرض فوري من الكاش
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    try {
      prayers = JSON.parse(cached);
      render(prayers);
      console.log('✅ من الكاش:', prayers.length, 'دعاء');
    } catch(e) { localStorage.removeItem(CACHE_KEY); }
  }

  // 2. جلب النصوص الكاملة من المصدر
  if (navigator.onLine) {
    let loaded = false;
    for (const url of DATA_SOURCES) {
      try {
        const res = await fetch(url);
        if (!res.ok) continue;
        const data = await res.json();
        if (Array.isArray(data) && data.length >= 54) {
          prayers = data;
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e) {}
          render(prayers);
          loaded = true;
          console.log('✅ تم تحميل النصوص الكاملة من:', url);
          break;
        }
      } catch(e) { console.warn('⚠️ فشل:', url); }
    }
    if (!loaded && !cached) showError();
  } else if (!cached) {
    showError();
  }

  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
}

function updateStatus() {
  const d = document.getElementById('dot');
  const t = document.getElementById('stxt');
  if (navigator.onLine) { d.className='dot on'; t.textContent='متصل • النصوص كاملة'; }
  else { d.className='dot off'; t.textContent='غير متصل • وضع محلي'; }
}

function showError() {
  document.getElementById('app').innerHTML = `
    <div class="err">
      <p style="font-size:3rem;margin-bottom:15px">📴</p>
      <h3>لم يتم العثور على بيانات</h3>
      <p>ضع ملف <code>sahifa.json</code> بجانب هذا الملف</p>
      <p>أو اتصل بالإنترنت مرة واحدة لتحميل النصوص الكاملة</p>
      <button class="btn" onclick="reload()" style="margin-top:20px">إعادة المحاولة</button>
    </div>`;
}

function reload() { localStorage.removeItem(CACHE_KEY); location.reload(); }

function render(data) {
  const c = document.getElementById('app');
  if (!data || !data.length) return;
  let h = '';
  data.forEach((d, i) => {
    const id = d.id || d.number || i + 1;
    const title = d.title || d.name || `دعاء ${id}`;
    const txt = d.text || d.content || d.body || '';
    const prev = txt.substring(0, 120).replace(/<[^>]*>/g, '') + '...';
    h += `<div class="card" onclick="openR(${i})">
      <div class="num">الدعاء ${id}</div>
      <div class="title">${title}</div>
      <div class="preview">${prev}</div>
    </div>`;
  });
  c.innerHTML = h;
}

function openR(i) {
  const d = prayers[i];
  const m = document.getElementById('modal');
  const id = d.id || d.number || i + 1;
  document.getElementById('mTitle').textContent = `الدعاء ${id}: ${d.title || d.name || ''}`;
  let txt = d.text || d.content || d.body || 'النص غير متوفر';
  txt = txt.replace(/\n/g, '<br>');
  if (!txt.includes('<p>')) txt = `<p>${txt}</p>`;
  document.getElementById('mText').innerHTML = txt;
  m.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeM() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function chgFont() {
  const m = document.getElementById('modal');
  const cls = ['', 'fs-1', 'fs-2', 'fs-3'];
  m.classList.remove(...cls);
  fsIdx = (fsIdx + 1) % cls.length;
  if (cls[fsIdx]) m.classList.add(cls[fsIdx]);
}

document.getElementById('search').addEventListener('input', e => {
  const t = e.target.value.trim().toLowerCase();
  if (!t) return render(prayers);
  const f = prayers.filter(d =>
    (d.title || d.name || '').toLowerCase().includes(t) ||
    (d.text || d.content || '').toLowerCase().includes(t)
  );
  render(f);
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
</script>
</body>
</html>
