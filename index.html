<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الصحيفة السجادية الكاملة | Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p:#0f4c3a; --g:#d4af37; --bg:#fdfbf7; --t:#2c2c2c; }
        * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Amiri',serif; background:var(--bg); color:var(--t); line-height:1.8; }
        
        header { background:linear-gradient(135deg,var(--p),#1a6b52); color:#fff; padding:20px; text-align:center; position:sticky; top:0; z-index:100; box-shadow:0 4px 15px rgba(0,0,0,.1); }
        header h1 { font-size:1.5rem; margin-bottom:5px; }
        .status { font-size:.8rem; opacity:.9; display:flex; justify-content:center; gap:8px; align-items:center; }
        .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#4ade80; box-shadow:0 0 5px #4ade80; }

        .controls { padding:15px; display:flex; gap:10px; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); position:sticky; top:75px; z-index:90; border-bottom:1px solid #eee; }
        input { flex:1; padding:10px 15px; border-radius:25px; border:1px solid #ddd; font-family:inherit; outline:none; }
        input:focus { border-color:var(--g); }
        .btn { padding:8px 16px; border:1px solid var(--p); border-radius:20px; background:transparent; color:var(--p); font-family:inherit; cursor:pointer; white-space:nowrap; }
        .btn:hover,.btn.active { background:var(--p); color:#fff; }

        .container { padding:15px; max-width:800px; margin:0 auto; }
        .card { background:#fff; border-radius:12px; padding:20px; margin-bottom:15px; box-shadow:0 2px 10px rgba(0,0,0,.05); border-right:4px solid var(--g); cursor:pointer; transition:.2s; }
        .card:active { transform:scale(.98); }
        .num { color:var(--g); font-weight:bold; font-size:.9rem; margin-bottom:5px; }
        .title { font-size:1.3rem; color:var(--p); margin-bottom:8px; }
        .preview { font-size:.95rem; color:#666; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:200; transform:translateY(100%); transition:.3s ease-in-out; overflow-y:auto; padding:20px; }
        .modal.open { transform:translateY(0); }
        .m-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; padding-bottom:15px; border-bottom:2px solid var(--g); position:sticky; top:0; background:var(--bg); z-index:10; padding-top:10px; }
        .close { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--p); padding:5px 10px; }
        .text { font-size:1.4rem; line-height:2.2; text-align:justify; margin-bottom:40px; }
        .text p { margin-bottom:15px; }

        .fs-1 .text { font-size:1.1rem; line-height:1.9; }
        .fs-2 .text { font-size:1.7rem; line-height:2.4; }
        .fs-3 .text { font-size:2rem; line-height:2.6; }

        @media (max-width:600px) { header h1{font-size:1.3rem} .text{font-size:1.2rem} }
    </style>
</head>

<script>
// ================= الصحيفة السجادية الكاملة (54 دعاءً) =================
const SAHIFA = [
{id:1,title:"دعاء في حمد الله وتمجيده",text:`الْحَمْدُ لِلَّهِ الَّذِي لَا مُضَادَّ لَهُ فِي حُكْمِهِ، وَلَا مُنَازِعَ لَهُ فِي قِسْمِهِ، وَلَا مُغَالِبَ لَهُ فِي أَمْرِهِ.
الْحَمْدُ لِلَّهِ الْأَوَّلِ قَبْلَ الْأَشْيَاءِ وَالْأَحْيَاءِ، وَالْآخِرِ بَعْدَ فَنَاءِ الْأَشْيَاءِ.
الْعَلِيمِ الَّذِي لَا يَنْسَى مَنْ ذَكَرَهُ، وَلَا يَنْقُصُ مَنْ شَكَرَهُ، وَلَا يَخِيبُ مَنْ دَعَاهُ، وَلَا يَقْطَعُ رَجَاءَ مَنْ رَجَاهُ.
اللَّهُمَّ إِنِّي أُشْهِدُكَ، وَكَفَى بِكَ شَهِيداً، وَأُشْهِدُ جَمِيعَ مَلَائِكَتِكَ، وَرُسُلِكَ، وَسُكَّانَ سَمَاوَاتِكَ، وَحَمَلَةَ عَرْشِكَ، وَمَنْ بَعَثْتَ مِنْ أَنْبِيَائِكَ وَرُسُلِكَ، وَأَنْشَأْتَ مِنْ أَصْنَافِ خَلْقِكَ، أَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللهُ الَّذِي لَا إِلَهَ إِلَّا أَنْتَ، وَحْدَكَ لَا شَرِيكَ لَكَ وَلَا عَدِيلَ، وَلَا خُلْفَ لِقَوْلِكَ، وَلَا تَبْدِيلَ لِحُكْمِكَ.
وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُكَ وَرَسُولُكَ، أَدَّى مَا حَمَّلْتَهُ إِلَى الْعِبَادِ، وَجَاهَدَ فِي اللهِ عَزَّ وَجَلَّ حَقَّ الْجِهَادِ، وَأَنَّهُ بَشَّرَ بِمَا هُوَ حَقٌّ مِنَ الثَّوَابِ، وَأَنْذَرَ بِمَا هُوَ صِدْقٌ مِنَ الْعِقَابِ.
اللَّهُمَّ ثَبِّتْنِي عَلَى دِينِكَ مَا أَحْيَيْتَنِي، وَلَا تُزِغْ قَلْبِي بَعْدَ إِذْ هَدَيْتَنِي، وَهَبْ لِي مِنْ لَدُنْكَ رَحْمَةً، إِنَّكَ أَنْتَ الْوَهَّابُ.`},

{id:2,title:"دعاء في الصلاة على النبي وآله",text:`اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ، بِأَفْضَلِ مَا صَلَّيْتَ عَلَى أَحَدٍ مِنْ خَلْقِكَ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، صَلاةً تَكُونُ لَكَ رِضاً، وَلِحَقِّهِ أَدَاءً.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، كَمَا هَدَيْتَنَا بِهِ مِنَ الضَّلَالَةِ، وَبَصَّرْتَنَا بِهِ مِنَ الْعَمَى، وَأَرْشَدْتَنَا بِهِ مِنَ الْغَيِّ، وَأَسْمَعْتَنَا بِهِ مِنَ الصَّمَمِ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، صَلاةً تُبَلِّغُهُ بِهَا أَفْضَلَ مَا يَأْمَلُ مِنْ خَيْرِكَ وَفَضْلِكَ وَكَرَامَتِكَ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، صَلاةً لَا غَايَةَ لِعَدَدِهَا، وَلَا نِهَايَةَ لِمَدَدِهَا، وَلَا أَمَدَ لِأَجَلِهَا.
اللَّهُمَّ وَاجْعَلْ صَلَوَاتِكَ وَصَلَوَاتِ مَلَائِكَتِكَ الْمُقَرَّبِينَ، وَأَنْبِيَائِكَ الْمُرْسَلِينَ، وَعِبَادِكَ الصَّالِحِينَ، وَأَهْلِ السَّمَاوَاتِ وَالْأَرْضِينَ، وَمَنْ سَبَّحَ لَكَ مِنْ أَوَّلِ الدُّنْيَا إِلَى آخِرِهَا، عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ وَنَبِيِّكَ.`},

{id:3,title:"دعاء في الصلاة على حملة العرش",text:`اللَّهُمَّ إِنَّ حَمَلَةَ عَرْشِكَ الْمَلَائِكَةَ الْمُقَرَّبِينَ يُسَبِّحُونَكَ بِالْأَسْحَارِ وَالْآصَالِ، لَا يَسْأَمُونَ مِنْ تَقْدِيسِكَ وَتَحْمِيدِكَ وَتَمْجِيدِكَ.
اللَّهُمَّ فَصَلِّ عَلَى مُحَمَّدٍ وَآلِهِ كَمَا صَلَّيْتَ عَلَى مَلَائِكَتِكَ الْمُقَرَّبِينَ، وَارْزُقْنَا مِنْ خَيْرِكَ مَا رَزَقْتَهُمْ.
اللَّهُمَّ إِنَّهُمْ لَا يَعْصُونَكَ مَا أَمَرْتَهُمْ، وَيَفْعَلُونَ مَا يُؤْمَرُونَ.
فَاجْعَلْنَا مِمَّنْ يَطِيعُكَ فِي كُلِّ مَا أَمَرْتَهُ، وَيَنْتَهِي عَمَّا نَهَيْتَهُ عَنْهُ، وَيَشْكُرُكَ عَلَى مَا أَنْعَمْتَ بِهِ عَلَيْهِ.
اللَّهُمَّ وَارْزُقْنَا قُلُوباً تَخْشَعُ لَكَ، وَأَلْسِنَةً تَذْكُرُكَ، وَأَعْمَالاً تُرْضِيكَ.`},

{id:4,title:"دعاء في التصديق بالرسل",text:`اللَّهُمَّ إِنَّا نُؤْمِنُ بِرُسُلِكَ الَّذِينَ أَرْسَلْتَهُمْ، وَنُصَدِّقُ بِمَا جَاؤُوا بِهِ مِنْ عِنْدِكَ، وَنَشْهَدُ أَنَّهُمْ قَدْ بَلَّغُوا رِسَالَاتِ رَبِّهِمْ، وَأَدَّوْا مَا حُمِّلُوا.
اللَّهُمَّ فَصَلِّ عَلَى مُحَمَّدٍ خَاتَمِ النَّبِيِّينَ، وَعَلَى آلِهِ الطَّيِّبِينَ الطَّاهِرِينَ.
اللَّهُمَّ اجْعَلْنَا مِمَّنْ يَتَّبِعُ الرُّسُلَ بِالْحُسْنَى، وَيُصَدِّقُ بِالْحَقِّ الَّذِي جَاؤُوا بِهِ.
وَاجْعَلْنَا مِمَّنْ قَالَ لَهُمْ رَبُّهُمْ: ﴿لَا خَوْفٌ عَلَيْكُمْ وَلَا أَنْتُمْ تَحْزَنُونَ﴾.`},

{id:5,title:"دعاء لنفسه ولأهل ولايته",text:`اللَّهُمَّ إِنِّي أَسْتَجِيرُ بِكَ، وَاسْتَجِرْنِي مِنْ عَذَابِكَ وَسُوءِ حِسَابِكَ.
اللَّهُمَّ اغْفِرْ لِي وَلِإِخْوَانِي وَلِمَنْ دَخَلَ بَيْتِيَ مِنَ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ.
اللَّهُمَّ وَأَسْأَلُكَ لِجَمِيعِ أَهْلِ وَلَايَتِكَ، الَّذِينَ اسْتَجَابُوا لَكَ بَعْدَ إِذْ دَعَوْتَهُمْ إِلَى طَاعَتِكَ، أَنْ تَغْفِرَ لَهُمْ ذُنُوبَهُمْ، وَتَسْتُرَ عُيُوبَهُمْ.
اللَّهُمَّ وَلَا تُخْرِجْنِي مِنَ الدُّنْيَا إِلَّا وَقَدْ سَتَرْتَ عَلَيَّ مَا أَسْلَفْتُ مِنْ مَعَاصِيكَ، وَمَحَوْتَ عَنِّي مَا اجْتَرَحْتُ مِنْ سَيِّئَاتِي.
اللَّهُمَّ ارْحَم ضَعْفَ بَدَنِي، وَرِقَّةَ جِلْدِي، وَدِقَّةَ عَظْمِي.`},

{id:6,title:"دعاء الصباح والمساء",text:`اللَّهُمَّ يَا مَنْ دَلَعَ لِسَانَ الصَّبَاحِ بِنُطْقِ تَبَلُّجِهِ، وَسَرَّحَ قِطَعَ اللَّيْلِ الْمُظْلِمِ بِغَيَاهِبِ تَلَجْلُجِهِ.
وَأَتْقَنَ صُنْعَ الْفَلَكِ الدَّائِرِ فِي مَقَادِيرِ تَبَرُّجِهِ، وَشَعْشَعَ ضِيَاءَ الشَّمْسِ بِنُورِ تَأَجُّجِهِ.
اللَّهُمَّ فَصَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَأَوْجِبْ لِي بِكَ أَنْ أَكُونَ خَيْرَ أَهْلِ الْأَرْضِ مَأْثَراً، وَأَكْرَمَهُمْ جِوَاراً، وَأَفْضَلَهُمْ عَمَلاً.
اللَّهُمَّ اكْفِنِي مَا شَغَلَنِي هَمُّهُ عَنِ الْقِيَامِ بِمَا أَمَرْتَنِي بِهِ، وَنَهَيْتَنِي عَنْهُ.
اللَّهُمَّ لَا تَكِلْنِي إِلَى نَفْسِي فِي شَيْءٍ مِنْ أَمْرِي، وَلَا تَتْرُكْنِي فِي ظُلْمَةٍ لَا يَهْتَدِي فِيهَا بَصَرِي.`},

{id:7,title:"دعاء عند الشدائد والمكروهات",text:`اللَّهُمَّ يَا مُنْزِلَ كُلِّ شِدَّةٍ، وَيَا مُفَرِّجَ كُلِّ كَرْبَةٍ، وَيَا صَاحِبَ كُلِّ غُرْبَةٍ، وَيَا مُغِيثَ كُلِّ صَرْخَةٍ، وَيَا نَاصِرَ كُلِّ ضَعِيفٍ.
اللَّهُمَّ إِنِّي أَشْكُو إِلَيْكَ مَا لَا يَخْفَى عَلَيْكَ مِنْ ضَعْفِي وَقِلَّةِ حِيلَتِي وَهَوَانِي عَلَى النَّاسِ.
اللَّهُمَّ افْتَحْ لِي أَبْوَابَ فَرْجِكَ بِحَوْلِكَ وَقُوَّتِكَ، وَلَا تَكِلْنِي إِلَى حَوْلِي وَقُوَّتِي طَرْفَةَ عَيْنٍ.
اللَّهُمَّ إِنِّي عَبْدُكَ الضَّعِيفُ الذَّلِيلُ، الْمُعْتَرِفُ بِذَنْبِهِ، الْمُسْتَكِينُ لِعِزَّتِكَ، الْمُلْتَجِئُ إِلَى رَحْمَتِكَ.
فَارْحَمْنِي بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ، وَاعْفُ عَنِّي بِعَفْوِكَ الَّذِي عَمَّ جَمِيعَ خَلْقِكَ.`},

{id:8,title:"دعاء في الاستعاذة",text:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ.
اللَّهُمَّ أَعِذْنِي مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا.
اللَّهُمَّ أَعِذْنِي مِنْ يَوْمِ الْفَقْرِ، وَمِنْ لَيْلَةِ الْقَبْرِ، وَمِنْ شَرِّ الْغِنَى، وَمِنْ شَرِّ الْفَقْرِ.
اللَّهُمَّ أَعِذْنِي مِنْ مُنْكَرَاتِ الْأَخْلَاقِ، وَالْأَعْمَالِ، وَالْأَهْوَاءِ، وَالْأَدْوَاءِ.
إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، وَبِكُلِّ شَيْءٍ مُحِيطٌ.`},

{id:9,title:"دعاء في الاشتياق إلى طلب المغفرة",text:`اللَّهُمَّ أَنْتَ رَبِّي، لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.
اللَّهُمَّ اجْعَلْنِي مِمَّنْ يَشْتَاقُ إِلَى لِقَائِكَ، وَيَتُوبُ إِلَيْكَ قَبْلَ مَنِيَّتِهِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ تَوْبَةً نَصُوحاً، تَمْحُو بِهَا مَا كَانَ مِنِّي مِنْ سَيِّئِ الْأَعْمَالِ، وَتُبَدِّلُ بِهَا حَسَنَاتٍ.
اللَّهُمَّ لَا تَحْرِمْني عَفْوَكَ، وَلَا تُبْعِدْنِي مِنْ رَحْمَتِكَ.`},

{id:10,title:"دعاء في اللجوء إلى الله",text:`إِلَهِي أَلْجَأَتْنِي الْمَعَاصِي إِلَى الِاسْتِكَانَةِ، وَأَسْلَمَتْنِي الذُّنُوبُ إِلَى الِانْقِطَاعِ.
إِلَهِي، هَبْ لِي مِنْ خَشْيَتِكَ مَا يَحُولُ بَيْنِي وَبَيْنَ مَعْصِيَتِكَ.
إِلَهِي، أَنَا الْفَقِيرُ فِي تَحَمُّلِ مَئُونَةِ نَفْسِي، وَأَنْتَ الْغَنِيُّ عَنْ كُلِّ أَحَدٍ.
إِلَهِي، لَا تَحْرِمْنِي مِنْ دُعَائِكَ، وَلَا تُخَيِّبْنِي فِي رَجَائِكَ.
إِلَهِي، مَنْ ذَا الَّذِي يَدْعُوكَ فَلَا تَسْتَجِيبُ لَهُ؟ وَمَنْ ذَا الَّذِي يَسْأَلُكَ فَلَا تُعْطِيهِ؟ وَمَنْ ذَا الَّذِي يَتُوبُ إِلَيْكَ فَلَا تَتُوبُ عَلَيْهِ؟
إِلَهِي، كَفَى بِي عِزّاً أَنْ أَكُونَ لَكَ عَبْداً، وَكَفَى بِي فَخْراً أَنْ تَكُونَ لِي رَبّاً. أَنْتَ كَمَا أُحِبُّ، فَاجْعَلْنِي كَمَا تُحِبُّ.`},

{id:11,title:"دعاء في خواتيم الخير",text:`اللَّهُمَّ اجْعَلْ خَيْرَ عُمُرِي آخِرَهُ، وَخَيْرَ عَمَلِي خَوَاتِمَهُ، وَخَيْرَ أَيَّامِي يَوْمَ أَلْقَاكَ.
اللَّهُمَّ اجْعَلْ خَاتِمَةَ أَمْرِي عَفْوَكَ وَمَغْفِرَتَكَ وَرِضْوَانَكَ.
اللَّهُمَّ اجْعَلْنَا مِمَّنْ حَسُنَتْ خَاتِمَتُهُ، وَسَلِمَتْ عَاقِبَتُهُ.
اللَّهُمَّ لَا تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّنَا، وَلَا مَبْلَغَ عِلْمِنَا، وَلَا إِلَى النَّارِ مَصِيرَنَا.
اللَّهُمَّ اجْعَلِ الْجَنَّةَ هِيَ دَارَنَا وَمُسْتَقَرَّنَا، بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.`},

{id:12,title:"دعاء في الاعتراف بالذنوب",text:`اللَّهُمَّ إِنِّي أَعْتَرِفُ لَكَ بِذُنُوبِي كَثِيرَةٍ، وَقَدْ غَفَرْتَ لِي مَا هُوَ أَكْثَرُ مِنْهَا.
اللَّهُمَّ إِنِّي أَجِدُ فِي كِتَابِكَ أَنَّكَ قُلْتَ: ﴿وَمَنْ يَعْمَلْ سُوءاً أَوْ يَظْلِمْ نَفْسَهُ ثُمَّ يَسْتَغْفِرِ اللهَ يَجِدِ اللهَ غَفُوراً رَحِيماً﴾.
اللَّهُمَّ فَقَدْ عَمِلْتُ سُوءاً وَظَلَمْتُ نَفْسِي، وَأَنَا أَسْتَغْفِرُكَ فَاغْفِرْ لِي.
اللَّهُمَّ وَجَدْتُكَ أَرْحَمَ الرَّاحِمِينَ، وَأَكْرَمَ الْأَكْرَمِينَ، وَأَنَا عَبْدُكَ الْخَاطِئُ الْمُذْنِبُ.
اللَّهُمَّ فَاصْفَحْ عَنِّي بِصَفْحِكَ الْجَمِيلِ، وَتَجَاوَزْ عَنِّي بِتَجَاوُزِكَ الْكَرِيمِ.`},

{id:13,title:"دعاء في طلب الحوائج",text:`اللَّهُمَّ إِنِّي أَسْأَلُكَ بِحَقِّ مُحَمَّدٍ وَآلِ مُحَمَّدٍ، أَنْ تُصَلِّيَ عَلَى مُحَمَّدٍ وَآلِ مُحَمَّدٍ، وَأَنْ تَقْضِيَ حَاجَتِي.
اللَّهُمَّ لَا تَرُدَّنِي خَائِباً، وَلَا تُخَيِّبْ لِي رَجَاءً، وَلَا تَقْطَعْ لِي أَمَلاً.
اللَّهُمَّ إِنِّي فَقِيرٌ إِلَى رَحْمَتِكَ، مُفْتَقِرٌ إِلَى مَعُونَتِكَ، مُلْتَجِئٌ إِلَى كَنَفِكَ.
اللَّهُمَّ أَعْطِنِي سُؤْلِي، وَبَلِّغْنِي أَمَلِي، وَاقْضِ حَاجَتِي.
اللَّهُمَّ إِنَّكَ تَعْلَمُ مَا أُرِيدُ قَبْلَ أَنْ أَسْأَلَكَ، فَارْزُقْنِي قَبْلَ أَنْ أَسْأَلَ، وَارْحَمْنِي قَبْلَ أَنْ أَسْتَرْحِمَكَ.
اللَّهُمَّ اجْعَلْ لِي مِنْ كُلِّ هَمٍّ فَرَجاً، وَمِنْ كُلِّ ضِيقٍ مَخْرَجاً، وَمِنْ كُلِّ بَلَاءٍ عَافِيَةً.`},

{id:14,title:"دعاء في دفع كيد الظالمين",text:`اللَّهُمَّ يَا عَدْلُ فِي قَضَائِكَ، يَا حَكِيمُ فِي أَمْرِكَ، يَا رَؤُوفاً بِعِبَادِكَ.
اللَّهُمَّ اكْفِنِي الظَّالِمِينَ بِمَا شِئْتَ، وَاصْرِفْ عَنِّي كَيْدَهُمْ وَمَكْرَهُمْ.
اللَّهُمَّ أَلْهِمْهُمُ الرُّشْدَ، وَاهْدِهِمْ إِلَى الْحَقِّ، أَوْ أَزِحْهُمْ عَنْ طَرِيقِي.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ كُلِّ جَبَّارٍ عَنِيدٍ، وَشَيْطَانٍ مَرِيدٍ.
اللَّهُمَّ اجْعَلْ بَيْنِي وَبَيْنَهُمْ سَدّاً وَرِدّاً، كَمَا جَعَلْتَ بَيْنَ الْحَقِّ وَالْبَاطِلِ حِجَاباً مَسْتُوراً.`},

{id:15,title:"دعاء عند المرض",text:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ وَالْجُنُونِ وَالْجُذَامِ وَمِنْ سَيِّئِ الْأَسْقَامِ.
اللَّهُمَّ اشْفِنِي شِفَاءً لَا يُغَادِرُ سَقَماً، اللَّهُمَّ أَلْبِسْنِي ثَوْبَ الْعَافِيَةِ.
اللَّهُمَّ ارْحَمْ ضَعْفِي وَقِلَّةَ حِيلَتِي، وَارْفَعْ عَنِّي مَا أَجِدُ مِنْ أَلَمٍ وَوَجَعٍ.
اللَّهُمَّ إِنَّكَ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَماً.
اللَّهُمَّ عَافِنِي فِي بَدَنِي، وَعَافِنِي فِي سَمْعِي، وَعَافِنِي فِي بَصَرِي.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ.`},

{id:16,title:"دعاء الاستسقاء بعد القحط",text:`اللَّهُمَّ اسْقِنَا الْغَيْثَ، وَلَا تَجْعَلْنَا مِنَ الْقَانِطِينَ.
اللَّهُمَّ إِنَّ بِالْعِبَادِ وَالْبِلَادِ مِنَ الْجَهْدِ وَالْجُوعِ وَالضَّنْكِ مَا لَا نَشْكُو إِلَّا إِلَيْكَ.
اللَّهُمَّ أَنْبِتْ لَنَا الزَّرْعَ، وَأَدِرَّ لَنَا الضَّرْعَ، وَاسْقِنَا مِنْ بَرَكَاتِ السَّمَاءِ.
اللَّهُمَّ أَنْزِلْ عَلَيْنَا مِنَ السَّمَاءِ مَاءً طَهُوراً، وَأَحْيِ بِهِ بَلْدَةً مَيْتاً.
اللَّهُمَّ اسْقِنَا غَيْثاً مُغِيثاً، هَنِيئاً مَرِيئاً، غَدَقاً طَبَقاً، عَاجِلاً غَيْرَ رَائِثٍ، نَافِعاً غَيْرَ ضَارٍّ.
اللَّهُمَّ بِرَحْمَتِكَ أَرْوِ أَرْضَكَ، وَأَغِثْ عِبَادَكَ، وَأَنْعِشْ بِلَادَكَ.`},

{id:17,title:"دعاء الاستعاذة من مكاره الأخلاق",text:`اللَّهُمَّ أَعِذْنِي مِنْ مُنْكَرَاتِ الْأَخْلَاقِ، وَالْأَعْمَالِ، وَالْأَهْوَاءِ، وَالْأَدْوَاءِ.
اللَّهُمَّ أَعِذْنِي مِنَ الْحَسَدِ وَالْبَغْيِ وَالْكِبْرِ وَالرِّيَاءِ وَالسُّمْعَةِ.
اللَّهُمَّ أَعِذْنِي مِنَ الْفُحْشِ وَالتَّفَحُّشِ، وَمِنَ الْبُخْلِ وَالشُّحِّ، وَمِنَ الْقَسْوَةِ وَالْغَفْلَةِ.
اللَّهُمَّ زَيِّنِّي بِزِينَةِ التَّقْوَى، وَاجْعَلْنِي مِنَ الْمُتَّقِينَ.
اللَّهُمَّ أَلْهِمْنِي رُشْدِي، وَأَعِذْنِي مِنْ شَرِّ نَفْسِي.
اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ، وَعَمَلِي مِنَ الرِّيَاءِ، وَلِسَانِي مِنَ الْكَذِبِ، وَعَيْنِي مِنَ الْخِيَانَةِ.`},

{id:18,title:"دعاء عند ذكر الشيطان والاستعاذة منه",text:`اللَّهُمَّ أَعِذْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ، وَمِنْ هَمْزِهِ وَنَفْثِهِ وَنَفْخِهِ.
اللَّهُمَّ اجْعَلْ بَيْنِي وَبَيْنَ الشَّيْطَانِ سُلْطَاناً نَصِيراً.
اللَّهُمَّ احْرُسْنِي مِنْ مَسِّ الشَّيْطَانِ، وَحِزْبِهِ، وَجُنْدِهِ، وَأَوْلِيَائِهِ.
اللَّهُمَّ إِنَّ الشَّيْطَانَ لَنَا عَدُوٌّ، فَاجْعَلْهُ مِنَ الْمَدْحُورِينَ الْمُهْزُومِينَ.
اللَّهُمَّ أَعِذْنِي مِنْ وَسَاوِسِهِ وَتَزْيِينِهِ، وَمِنْ ضَلَالِهِ وَإِغْوَائِهِ.`},

{id:19,title:"دعاء مكارم الأخلاق (الأول)",text:`اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَبَلِّغْ بِإِيمَانِي أَكْمَلَ الْإِيمَانِ، وَاجْعَلْ يَقِينِي أَفْضَلَ الْيَقِينِ، وَانْتَهِ بِنِيَّتِي إِلَى أَحْسَنِ النِّيَّاتِ، وَبِعَمَلِي إِلَى أَحْسَنِ الْأَعْمَالِ.
اللَّهُمَّ وَفِّرْ بِلُطْفِكَ نِيَّتِي، وَأَصْلِحْ لِي مَا فِيهِ مُنْقَلَبِي، وَاجْعَلْ فِي خَيْرِ أَيَّامِي يَوْمَ أَلْقَاكَ.
اللَّهُمَّ أَحْسِنْ فِي كُلِّ الْأَحْوَالِ عَلَيَّ الْعَاقِبَةَ، وَلَا تَخْزِنِي فِي حَيَاتِي وَلَا بَعْدَ وَفَاتِي.
اللَّهُمَّ ارْزُقْنِي صِدْقَ اللِّسَانِ، وَطَهَارَةَ الْقَلْبِ، وَاسْتِقَامَةَ الْعَمَلِ.
اللَّهُمَّ وَاجْعَلْنِي مِمَّنْ دَعَاكَ فَاسْتَجَبْتَ لَهُ، وَسَأَلَكَ فَأَعْطَيْتَهُ، وَتَضَرَّعَ إِلَيْكَ فَرَحِمْتَهُ.`},

{id:20,title:"دعاء مكارم الأخلاق (الثاني)",text:`اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَاحْمِلْنِي بِكَ عَلَى مَحَامِدِ الْأَخْلَاقِ، الَّتِي لَا تَبْلُغُهَا إِلَّا بِكَ.
اللَّهُمَّ وَصَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَاجْعَلْ أَحْسَنَ صَلَاتِكَ وَأَزْكَى تَحِيَّاتِكَ وَأَكْمَلَ رَحَمَاتِكَ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ.
اللَّهُمَّ وَارْزُقْنِي الْحِلْمَ عَنِ الْجَاهِلِينَ، وَالصَّبْرَ عَلَى الْمُبْتَلِينَ، وَالشُّكْرَ فِي الرَّخَاءِ، وَالرِّضَا عَنِ اللهِ فِي السَّرَّاءِ وَالضَّرَّاءِ.
اللَّهُمَّ وَارْزُقْنِي الْخَوْفَ مِنْكَ فِي الْخَلَاءِ وَالْمَلَأِ، وَالْقَصْدَ فِي الْغَضَبِ وَالرِّضَا، وَالْعَدْلَ فِي الْحُبِّ وَالْبُغْضِ.`},

{id:21,title:"دعاء عند الكرب والغم",text:`اللَّهُمَّ يَا مَنْ لَا إِلَهَ إِلَّا هُوَ، الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ.
اللَّهُمَّ فَرِّجْ هَمِّي، وَنَفِّسْ كَرْبِي، وَأَذْهِبْ غَمِّي.
اللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ الْأَعْظَمِ الَّذِي إِذَا دُعِيتَ بِهِ أَجَبْتَ، وَإِذَا سُئِلْتَ بِهِ أَعْطَيْتَ.
اللَّهُمَّ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ.
اللَّهُمَّ أَكْثِرْ صَلَاتِي عَلَيْكَ، فَإِنَّ صَلَاتِي عَلَيْكَ دَلِيلٌ عَلَى صَلَاتِكَ عَلَيَّ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ وَفَرِّجْ عَنِّي مَا أَجِدُ.`},

{id:22,title:"دعاء عند الحزن والهم",text:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحُزْنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.
اللَّهُمَّ اكْشِفْ هَمِّي وَفَرِّجْ غَمِّي، وَارْحَمْ ضَعْفِي وَاجْبُرْ كَسْرِي.
اللَّهُمَّ مَا أَصَابَنِي مِنْ هَمٍّ أَوْ حُزْنٍ فَأَنْتَ حَسْبِي وَنِعْمَ الْوَكِيلُ.
اللَّهُمَّ اجْعَلْ بَعْدَ الْعُسْرِ يُسْراً، وَبَعْدَ الضِّيقِ سَعَةً.
إِنَّ مَعَ الْعُسْرِ يُسْراً، إِنَّ مَعَ الْعُسْرِ يُسْراً.`},

{id:23,title:"دعاء طلب العافية",text:`اللَّهُمَّ أَلْبِسْنِي الْعَافِيَةَ، وَجَلِّلْنِي الْعَافِيَةَ، وَحَصِّنِّي بِالْعَافِيَةِ، وَأَكْرِمْنِي بِالْعَافِيَةِ، وَأَغْنِنِي بِالْعَافِيَةِ.
اللَّهُمَّ إِنَّكَ عَافَيْتَنِي فَعُذْ بِي، وَرَزَقْتَنِي فَأَشْكُرْكَ.
اللَّهُمَّ عَافِنِي فِي بَدَنِي، وَعَافِنِي فِي سَمْعِي، وَعَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ وَالْمُعَافَاةَ فِي الدُّنْيَا وَالْآخِرَةِ.
اللَّهُمَّ عَافِنِي فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي.
اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي.`},

{id:24,title:"دعاء للوالدين",text:`اللَّهُمَّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيراً.
اللَّهُمَّ وَارْحَمْهُمَا بِرَحْمَتِكَ، وَاغْفِرْ لَهُمَا بِمَغْفِرَتِكَ، وَارْضَ عَنْهُمَا بِرِضْوَانِكَ.
اللَّهُمَّ وَأَوْصِلْ ثَوَابَ مَا أَعْمَلُهُ مِنْ صَالِحٍ إِلَيْهِمَا، وَاجْعَلْهُمَا مِنْ أَهْلِ الْجَنَّةِ.
اللَّهُمَّ كَمَا صَانَا فِي صِغَرِي، فَصُنْهُمَا فِي كِبَرِهِمَا.
اللَّهُمَّ وَاجْعَلْنِي بَارّاً بِهِمَا حَيّاً وَمَيِّتاً.
اللَّهُمَّ لَا تَحْرِمْنِي أَجْرَهُمَا، وَلَا تَفْتِنِّي بَعْدَهُمَا.`},

{id:25,title:"دعاء للأولاد",text:`اللَّهُمَّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً، إِنَّكَ سَمِيعُ الدُّعَاءِ.
اللَّهُمَّ وَاجْعَلْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِكَ، وَعِبَاداً صَالِحِينَ.
اللَّهُمَّ احْفَظْهُمْ فِي دِينِهِمْ وَأَبْدَانِهِمْ، وَارْزُقْهُمُ الْعِلْمَ وَالْحِكْمَةَ.
اللَّهُمَّ وَبَارِكْ لِي فِيهِمْ، وَاجْعَلْهُمْ قُرَّةَ أَعْيُنٍ لِي وَلِأُمَّهِمْ.
اللَّهُمَّ اجْعَلْهُمْ مِنْ أَهْلِ طَاعَتِكَ وَمَحَبَّتِكَ، وَلَا تَجْعَلْ لِلشَّيْطَانِ عَلَيْهِمْ سُلْطَاناً.`},

{id:26,title:"دعاء للجيران والأصدقاء",text:`اللَّهُمَّ أَحْسِنْ إِلَى جِيرَانِي، وَارْزُقْنِي حُسْنَ الْجِوَارِ مَعَهُمْ.
اللَّهُمَّ وَأَصْلِحْ ذَاتَ بَيْنِنَا، وَاهْدِنَا سُبُلَ السَّلَامِ.
اللَّهُمَّ ارْزُقْنَا مِنَ الْأَخْلَاقِ أَحْسَنَهَا، وَمِنَ الْأَعْمَالِ أَصْلَحَهَا.
اللَّهُمَّ اجْعَلْنَا لِلنَّاسِ رَحْمَةً، وَلَا تَجْعَلْنَا عَلَيْهِمْ فِتْنَةً.
اللَّهُمَّ وَأَلِّفْ بَيْنَ قُلُوبِنَا، وَأَصْلِحْ ذَاتَ بَيْنِنَا، وَاهْدِنَا سُبُلَ السَّلَامِ.`},

{id:27,title:"دعاء لأهل الثغور",text:`اللَّهُمَّ أَيِّدْهُمْ بِنَصْرِكَ، وَأَعْضُدْهُمْ بِمَلَائِكَتِكَ.
اللَّهُمَّ ثَبِّتْ أَقْدَامَهُمْ، وَارْبِطْ عَلَى قُلُوبِهِمْ.
اللَّهُمَّ اجْعَلْهُمْ كَالْجَبَلِ الرَّاسِخِ الَّذِي لَا تَزُلُّهُ الرِّيَاحُ.
اللَّهُمَّ احْفَظْهُمْ فِي أَمْوَالِهِمْ وَأَهْلِيهِمْ، وَارْدُدْهُمْ إِلَيْهِمْ سَالِمِينَ غَانِمِينَ.
اللَّهُمَّ انْصُرْهُمْ عَلَى مَنْ بَغَى عَلَيْهِمْ، وَانْصُرِ الْإِسْلَامَ وَالْمُسْلِمِينَ.`},

{id:28,title:"دعاء الشكوى إلى الله",text:`اللَّهُمَّ إِلَيْكَ أَشْكُو ضَعْفَ قُوَّتِي، وَقِلَّةَ حِيلَتِي، وَهَوَانِي عَلَى النَّاسِ.
يَا أَرْحَمَ الرَّاحِمِينَ، أَنْتَ رَبُّ الْمُسْتَضْعَفِينَ، وَأَنْتَ رَبِّي.
إِلَى مَنْ تَكِلُنِي؟ إِلَى بَعِيدٍ يَتَجَهَّمُنِي؟ أَمْ إِلَى عَدُوٍّ مَلَّكْتَهُ أَمْرِي؟
إِنْ لَمْ يَكُنْ بِكَ عَلَيَّ غَضَبٌ فَلَا أُبَالِي، غَيْرَ أَنَّ عَافِيَتَكَ أَوْسَعُ لِي.
أَعُوذُ بِنُورِ وَجْهِكَ الَّذِي أَشْرَقَتْ لَهُ الظُّلُمَاتُ، وَصَلُحَ عَلَيْهِ أَمْرُ الدُّنْيَا وَالْآخِرَةِ، مِنْ أَنْ تُنْزِلَ بِي غَضَبَكَ، أَوْ يَحِلَّ عَلَيَّ سَخَطُكَ.
لَكَ الْعُتْبَى حَتَّى تَرْضَى، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِكَ.`},

{id:29,title:"دعاء طلب الرزق",text:`اللَّهُمَّ ارْزُقْنِي رِزْقاً حَلَالاً طَيِّباً، وَكَفِّنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ، فَإِنَّهُ لَا يَمْلِكُهَا إِلَّا أَنْتَ.
اللَّهُمَّ وَاجْعَلْ رِزْقَكَ لِي وَاسِعاً، وَمَطْلَبَهُ سَهْلاً، وَمَأْخَذَهُ قَرِيباً.
اللَّهُمَّ لَا تُكِلْنِي إِلَى مَا مَلَّكْتَنِي، وَلَا إِلَى مَا مَلَّكْتَنِي مِنْ رِزْقٍ تَكِلُنِي فِيهِ إِلَى نَفْسِي.
اللَّهُمَّ ارْزُقْنِي مِنْ حَيْثُ لَا أَحْتَسِبُ، فَإِنَّكَ تَرْزُقُ مَنْ تَشَاءُ بِغَيْرِ حِسَابٍ.`},

{id:30,title:"دعاء قضاء الدين",text:`اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.
اللَّهُمَّ اقْضِ عَنِّي الدَّيْنَ، وَأَغْنِنِي مِنَ الْفَقْرِ.
اللَّهُمَّ يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ، وَيَا مُصَرِّفَ الْأُمُورِ صَرِّفْ أَمْرِي إِلَى خَيْرٍ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْفَقْرِ وَالْقِلَّةِ وَالذِّلَّةِ، وَأَعُوذُ بِكَ مِنْ أَنْ أَظْلِمَ أَوْ أُظْلَمَ.
اللَّهُمَّ سَدِّدْ دَيْنِي، وَأَصْلِحْ شَأْنِي كُلَّهُ، وَلا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.`},

{id:31,title:"دعاء التوبة والإنابة",text:`اللَّهُمَّ إِنِّي أَتُوبُ إِلَيْكَ مِنْ كُلِّ مَا نَهَيْتَنِي عَنْهُ، وَأَعُودُ إِلَى طَاعَتِكَ.
اللَّهُمَّ فَاقْبَلْ تَوْبَتِي، وَاغْسِلْ حَوْبَتِي، وَأَجِبْ دَعْوَتِي.
اللَّهُمَّ لَا تَرُدَّنِي خَائِباً، وَلَا تُخَيِّبْ فِيكَ رَجَائِي.
اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ.
اللَّهُمَّ أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَداً مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجِلَاءَ حُزْنِي، وَذَهَابَ هَمِّي.`},

{id:32,title:"دعاء صلاة الليل (الوتر)",text:`اللَّهُمَّ إِنِّي أَسْأَلُكَ إيمَاناً يُبَاشِرُ قَلْبِي، وَيَقِيناً صَادِقاً حَتَّى أَعْلَمَ أَنَّهُ لَا يُصِيبُنِي إِلَّا مَا كَتَبْتَ لِي.
اللَّهُمَّ اجْعَلْنِي مِمَّنْ يُقِيمُ اللَّيْلَ، وَيَتْلُو آيَاتِكَ آنَاءَ اللَّيْلِ وَأَطْرَافَ النَّهَارِ.
اللَّهُمَّ تَقَبَّلْ قِيَامِي، وَارْحَمْ سُهَادِي، وَاجْعَلْ لَيْلِي خَيْراً مِنْ نَهَارِي.
اللَّهُمَّ أَذِقْنِي حَلَاوَةَ ذِكْرِكَ، وَأَدِّ الشُّكْرَ لِنِعْمَتِكَ، وَاجْعَلْنِي مِنَ الْقَائِمِينَ فِي أَسْحَارِ اللَّيْلِ.
اللَّهُمَّ وَتَرٌ يَا وِتْرُ، أَسْأَلُكَ بِوِتْرِيَّتِكَ أَنْ تُوتِرَ لِي فِي كُلِّ أَمْرِي.`},

{id:33,title:"دعاء رؤية الهلال",text:`اللَّهُمَّ أَهْلَّهُ عَلَيْنَا بِالْأَمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، وَالْمُسَارَعَةِ إِلَى مَا تُحِبُّ وَتَرْضَى.
اللَّهُمَّ رَبِّي وَرَبُّكَ اللهُ، رَبُّ الْعَالَمِينَ.
اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ.
اللَّهُمَّ بَارِكْ لَنَا فِيهِ، وَارْزُقْنَا خَيْرَهُ وَخَيْرَ مَا فِيهِ، وَاصْرِفْ عَنَّا شَرَّهُ وَشَرَّ مَا فِيهِ.
اللَّهُمَّ وَاجْعَلْنَا مِمَّنْ صَامَهُ وَقَامَهُ، وَتُقُبِّلَ مِنْهُ، وَغُفِرَ لَهُ.`},

{id:34,title:"دعاء دخول شهر رمضان",text:`اللَّهُمَّ إِنَّ هَذَا شَهْرُ رَمَضَانَ الَّذِي أَنْزَلْتَ فِيهِ الْقُرْآنَ، وَجَعَلْتَهُ هُدًى لِلنَّاسِ وَبَيِّنَاتٍ مِنَ الْهُدَى وَالْفُرْقَانِ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَأَلْهِمْنَا مَعْرِفَةَ فَضْلِهِ، وَتَعْظِيمَ حُرْمَتِهِ، وَالتَّحَفُّظَ مِمَّا حَظَرْتَ فِيهِ.
اللَّهُمَّ وَأَعِنَّا عَلَى صِيَامِهِ بِكَفِّ الْجَوَارِحِ عَنْ مَعَاصِيكَ، وَاسْتِعْمَالِهَا فِيهِ بِمَا يُرْضِيكَ.
اللَّهُمَّ وَسَلِّمْهُ لَنَا، وَسَلِّمْنَا فِيهِ، وَسَلِّمْهُ مِنَّا تَسْلِيماً.
اللَّهُمَّ وَارْزُقْنَا فِيهِ التَّوْبَةَ قَبْلَ الْمَوْتِ، وَالْمَغْفِرَةَ عِنْدَ الْمَمَاتِ.
اللَّهُمَّ اجْعَلْنَا مِمَّنْ تَقَبَّلْتَ مِنْهُمْ صِيَامَهُمْ وَقِيَامَهُمْ.`},

{id:35,title:"دعاء وداع شهر رمضان",text:`اللَّهُمَّ لَا تَجْعَلْهُ آخِرَ الْعَهْدِ مِنَّا لِصِيَامِهِ، فَإِنْ جَعَلْتَهُ فَاجْعَلْنِي مَرْحُوماً وَلَا تَجْعَلْنِي مَحْرُوماً.
اللَّهُمَّ إِنَّ لَكَ أَوْقَاتاً فِي كُلِّ عَامٍ تَنْزِلُ فِيهَا بِاللُّطْفِ إِلَى عِبَادِكَ.
اللَّهُمَّ فَصَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَارْحَمْنَا بِمَا مَنَنْتَ بِهِ عَلَيْنَا فِيهِ.
اللَّهُمَّ تَقَبَّلْ مِنَّا مَا قَصَّرْنَا فِيهِ، وَاعْفُ عَنَّا مَا فَرَّطْنَا فِيهِ.
اللَّهُمَّ وَلَا تَسْلُبْنَا مَا أَعْطَيْتَنَا، وَلَا تَحْرِمْْنَا مَا رَزَقْتَنَا.
اللَّهُمَّ اجْعَلْنَا مِمَّنْ صَامَهُ حَقَّ صِيَامِهِ، وَقَامَهُ حَقَّ قِيَامِهِ.`},

{id:36,title:"دعاء عند رؤية هلال شوال",text:`اللَّهُمَّ لَا تَجْعَلْهُ آخِرَ الْعَهْدِ مِنَّا، وَاجْعَلْنَا مِمَّنْ تَقَبَّلْتَ مِنْهُمْ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَاجْعَلْ عِيدَنَا هَذَا سَعِيداً مَيْمُوناً مُبَارَكاً.
اللَّهُمَّ إِنَّا نَسْأَلُكَ مِنْ خَيْرِ هَذَا الْيَوْمِ، وَنَعُوذُ بِكَ مِنْ شَرِّهِ.
اللَّهُمَّ اجْعَلْنَا مِمَّنْ قَبِلْتَ صِيَامَهُمْ وَقِيَامَهُمْ، وَغَفَرْتَ لَهُمْ ذُنُوبَهُمْ.
اللَّهُمَّ أَدْخِلْ عَلَيْنَا هَذَا الْعِيدَ بِالْبَرَكَةِ وَالْيُمْنِ وَالْإِيمَانِ.`},

{id:37,title:"دعاء يوم عرفة",text:`الْحَمْدُ لِلَّهِ الَّذِي لَيْسَ لِقَضَائِهِ دَافِعٌ، وَلَا لِعَطَائِهِ مَانِعٌ، وَلَا كَصُنْعِهِ صُنْعُ صَانِعٍ، وَهُوَ الْجَوَادُ الْوَاسِعُ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ.
إِلَهِي، كَفَى بِي عِزّاً أَنْ أَكُونَ لَكَ عَبْداً، وَكَفَى بِي فَخْراً أَنْ تَكُونَ لِي رَبّاً. أَنْتَ كَمَا أُحِبُّ فَاجْعَلْنِي كَمَا تُحِبُّ.
اللَّهُمَّ مَا أَعَانَنِي عَلَى مَا تُحِبُّ وَتَرْضَى مِنَ الْأَعْمَالِ الصَّالِحَةِ، وَمَا أَلْهَمَنِي مِنْ حُسْنِ الْقَوْلِ وَحُسْنِ الْعَمَلِ.
إِلَهِي، هَبْ لِي كَمَالَ الانْقِطَاعِ إِلَيْكَ، وَأَنِرْ أَبْصَارَ قُلُوبِنَا بِضِيَاءِ نَظَرِهَا إِلَيْكَ، حَتَّى تَخْرِقَ أَبْصَارُ الْقُلُوبِ حُجُبَ النُّورِ فَتَصِلَ إِلَى مَعْدِنِ الْعَظَمَةِ.
إِلَهِي، اجْعَلْنِي مِمَّنْ نَادَيْتَهُ فَأَجَابَكَ، وَنَظَرْتَ إِلَيْهِ فَصَعِقَ لِعَظَمَتِكَ، فَنَاجَيْتَهُ سِرّاً، وَعَمِلَ لَكَ جَهْراً.
اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ صَلَّى اللهُ عَلَيْهِ وَآلِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَكَ مِنْهُ نَبِيُّكَ.
اللَّهُمَّ اجْعَلْ لِي مِنْ كُلِّ هَمٍّ وَغَمٍّ فَرَجاً وَمَخْرَجاً، وَارْزُقْنِي مِنْ حَيْثُ لَا أَحْتَسِبُ.
إِلَهِي، إِنْ أَرَدْتَ بِنَا شِدَّةً فَاجْعَلْهَا كَفَّارَةً لِذُنُوبِنَا، وَإِنْ أَرَدْتَ بِنَا رَخَاءً فَاجْعَلْهُ عَوْناً عَلَى طَاعَتِكَ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَاجْعَلْ خَيْرَ أَعْمَالِنَا خَوَاتِمَهَا، وَخَيْرَ أَيَّامِنَا يَوْمَ نَلْقَاكَ فِيهِ.`},

{id:38,title:"دعاء يوم الأضحى ويوم الجمعة",text:`اللَّهُمَّ هَذَا يَوْمٌ مُبَارَكٌ سَعِيدٌ، جَعَلْتَهُ لِلْمُسْلِمِينَ عِيداً، وَلِمُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَآلِهِ ذُخْراً وَشَرَفاً وَمَزِيداً.
اللَّهُمَّ فَصَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، بِأَفْضَلِ صَلَوَاتِكَ.
اللَّهُمَّ إِنَّا نَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ وَخَيْرَ مَا فِيهِ.
اللَّهُمَّ تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ.
اللَّهُمَّ وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ.`},

{id:39,title:"دعاء في دفع كيد الأعداء",text:`اللَّهُمَّ إِنَّا نَشْكُو إِلَيْكَ فَقْدَ نَبِيِّنَا صَلَّى اللهُ عَلَيْهِ وَآلِهِ، وَغَيْبَةَ وَلِيِّنَا، وَشِدَّةَ الزَّمَانِ عَلَيْنَا.
اللَّهُمَّ اكْفِنَا الشَّرَّ وَادْفَعْ عَنَّا الْمَكْرُوهَ.
اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ شَرِّ كُلِّ ذِي شَرٍّ، وَمِنْ شَرِّ مَا ذَرَأْتَ وَبَرَأْتَ.
اللَّهُمَّ انْصُرْنَا عَلَى مَنْ بَغَى عَلَيْنَا، وَلَا تَجْعَلْ عَلَيْهِمْ سَبِيلاً.
اللَّهُمَّ شَتِّتْ شَمْلَهُمْ، وَفَرِّقْ جَمْعَهُمْ، وَاجْعَلْ تَدْبِيرَهُمْ تَدْمِيراً عَلَيْهِمْ.`},

{id:40,title:"دعاء من التوبة (الاستغفار)",text:`اللَّهُمَّ يَا غَافِرَ الذَّنْبِ، وَيَا قَابِلَ التَّوْبِ، يَا شَدِيدَ الْعِقَابِ، يَا ذَا الطَّوْلِ، لَا إِلَهَ إِلَّا أَنْتَ، إِلَيْكَ الْمَصِيرُ.
اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْماً كَثِيراً، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي.
اللَّهُمَّ إِنِّي أَعْتَرِفُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.
اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ.`},

{id:41,title:"دعاء طلب الستر",text:`اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، وَاحْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي.
اللَّهُمَّ وَاسْتُرْ عَلَيَّ فِي الدُّنْيَا وَالْآخِرَةِ، وَلَا تَفْضَحْنِي يَوْمَ الْقِيَامَةِ.
اللَّهُمَّ إِنَّكَ سَتَّارُ الْعُيُوبِ، غَفَّارُ الذُّنُوبِ، مُقِيلُ الْعَثَرَاتِ.
اللَّهُمَّ اسْتُرْنِي بِسِتْرِكَ الْجَمِيلِ، وَاحْجُبْنِي عَنْ أَعْيُنِ النَّاسِ بِحِجَابِكَ.`},

{id:42,title:"دعاء عند ختم القرآن",text:`اللَّهُمَّ ارْحَمْنِي بِالْقُرْآنِ، وَاجْعَلْهُ لِي إِمَاماً وَنُوراً وَهُدًى وَرَحْمَةً.
اللَّهُمَّ ذَكِّرْنِي مِنْهُ مَا نَسِيتُ، وَعَلِّمْنِي مِنْهُ مَا جَهِلْتُ، وَارْزُقْنِي تِلَاوَتَهُ آنَاءَ اللَّيْلِ وَأَطْرَافَ النَّهَارِ.
اللَّهُمَّ اجْعَلْهُ لِي حُجَّةً وَلَا تَجْعَلْهُ عَلَيَّ حُجَّةً.
اللَّهُمَّ اجْعَلِ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجِلَاءَ حُزْنِي، وَذَهَابَ هَمِّي.
اللَّهُمَّ وَاجْعَلْهُ شَفِيعاً لِي يَوْمَ الْقِيَامَةِ.`},

{id:43,title:"دعاء عند النظر إلى الكعبة",text:`اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، فَحَيِّنَا رَبَّنَا بِالسَّلَامِ.
اللَّهُمَّ زِدْ هَذَا الْبَيْتَ تَشْرِيفاً وَتَكْرِيماً، وَتَعْظِيماً وَمَهَابَةً.
اللَّهُمَّ وَزِدْ مَنْ شَرَّفَهُ وَعَظَّمَهُ مِمَّنْ حَجَّهُ أَوِ اعْتَمَرَهُ تَشْرِيفاً وَتَكْرِيماً وَتَعْظِيماً وَبِرّاً.
اللَّهُمَّ أَنْتَ السَّلَامُ، فَسَلِّمْنَا وَسَلِّمْ عَلَيْنَا، يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.`},

{id:44,title:"دعاء يوم الجمعة",text:`اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَبَارِكْ لَنَا فِي يَوْمِنَا هَذَا الَّذِي فَضَّلْتَهُ عَلَى سَائِرِ الْأَيَّامِ.
اللَّهُمَّ اجْعَلْنَا فِيهِ مِنْ أَسْعَدِ عِبَادِكَ نَصِيباً، وَأَوْفَرِهِمْ حَظّاً.
اللَّهُمَّ اغْفِرْ لَنَا فِيهِ، وَارْحَمْنَا، وَتَجَاوَزْ عَنَّا.
اللَّهُمَّ وَاجْعَلْنَا مِمَّنْ صَلَّى وَسَلَّمَ وَاسْتَغْفَرَ، وَتَابَ وَأَنَابَ.
اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَاجْعَلْنَا مِنْ أَهْلِ الْجُمُعَةِ وَصَلَوَاتِهَا.`},

{id:45,title:"دعاء يوم الفطر",text:`اللَّهُمَّ يَا ذَا الْمَنِّ الْعَظِيمِ، وَالْإِحْسَانِ الْقَدِيمِ، يَا وَاسِعَ الْمَغْفِرَةِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ حَقَّ هَذَا الْيَوْمِ الَّذِي جَعَلْتَهُ لِلْمُسْلِمِينَ عِيداً.
اللَّهُمَّ اجْعَلْنَا فِيهِ مِنَ الْفَائِزِينَ بِرِضْوَانِكَ، وَالْمُقَرَّبِينَ إِلَى جَنَّتِكَ.
اللَّهُمَّ تَقَبَّلْ مِنَّا صِيَامَنَا وَقِيَامَنَا، وَاجْعَلْنَا مِمَّنْ عُتِقَ فِيهِ مِنَ النَّارِ.
اللَّهُمَّ أَدْخِلْ عَلَيْنَا هَذَا الْعِيدَ بِالْخَيْرِ وَالْبَرَكَةِ وَالسَّعَادَةِ.`},

{id:46,title:"دعاء عند السفر",text:`اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ وَالْمَالِ.
اللَّهُمَّ اصْحَبْنَا بِنُصْحِكَ، وَاقْلِبْنَا بِذِمَّةٍ.
اللَّهُمَّ اطْوِ لَنَا الْأَرْضَ، وَهَوِّنْ عَلَيْنَا السَّفَرَ.
اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى.
اللَّهُمَّ هَوِّنْ عَلَيْنَا مَشَقَّةَ السَّفَرِ، وَارْدُدْنَا إِلَى أَهْلِنَا سَالِمِينَ غَانِمِينَ.
سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ.`},

{id:47,title:"دعاء يوم النحر",text:`اللَّهُمَّ إِنَّا نَتَوَجَّهُ إِلَيْكَ فِي هَذَا الْيَوْمِ الْمُبَارَكِ بِوُجُوهِ عِبَادِكَ الصَّالِحِينَ.
اللَّهُمَّ تَقَبَّلْ مِنَّا نُسُكَنَا وَأُضْحِيَاتِنَا.
اللَّهُمَّ اجْعَلْهَا بَلَاغاً إِلَى رِضْوَانِكَ وَجَنَّتِكَ.
اللَّهُمَّ صَلِّ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، وَسَلِّمْ تَسْلِيماً كَثِيراً.
اللَّهُمَّ تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ.`},

{id:48,title:"دعاء في ذكر الموت والاستعداد له",text:`اللَّهُمَّ ذَكِّرْنِي الْمَوْتَ وَكَرْبَتَهُ، وَالْقَبْرَ وَظُلْمَتَهُ، وَالصِّرَاطَ وَدِقَّتَهُ.
اللَّهُمَّ اجْعَلْ خَيْرَ عُمُرِي آخِرَهُ، وَخَيْرَ عَمَلِي خَوَاتِمَهُ.
اللَّهُمَّ أَعِذْنِي مِنْ مُنْكَرٍ وَنَكِيرٍ، وَمِنْ ضِيقِ الْمَلْحَدِ.
اللَّهُمَّ اجْعَلْ قَبْرِي رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ، وَلَا تَجْعَلْهُ حُفْرَةً مِنْ حُفَرِ النَّارِ.
اللَّهُمَّ أَعِذْنِي مِنْ يَوْمِ الْفَزَعِ الْأَكْبَرِ، وَيَوْمِ الْحِسَابِ.`},

{id:49,title:"دعاء في دفع مكروه الأعداء",text:`اللَّهُمَّ يَا كَافِيَ كُلِّ شَيْءٍ، اكْفِنَا مَا أَهَمَّنَا مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ.
اللَّهُمَّ ثَبِّتْ أَقْدَامَنَا، وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ.
اللَّهُمَّ لَا تَجْعَلْ لِلشَّيْطَانِ عَلَيْنَا سُلْطَاناً، وَلَا لِلْأَعْدَاءِ عَلَيْنَا سَبِيلاً.
اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ، وَنُؤْمِنُ بِكَ وَنَتَوَكَّلُ عَلَيْكَ.
اللَّهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الْأُمُورِ كُلِّهَا، وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا وَعَذَابِ الْآخِرَةِ.`},

{id:50,title:"دعاء الرهبة والخوف من الله",text:`إِلَهِي، أَخَافُ مِنْكَ وَأَرْجُوكَ، وَأَخْشَاكَ وَأَطْمَعُ فِيكَ.
إِلَهِي، لَا تُؤَاخِذْنِي بِمَا يَقُولُونَ، وَاغْفِرْ لِي مَا لَا يَعْلَمُونَ.
إِلَهِي، إِنِّي أَخَافُ يَوْماً تَشْخَصُ فِيهِ الْأَبْصَارُ، وَتَرْعَدُ فِيهِ الْجِبَالُ.
إِلَهِي، ارْحَمْنِي يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ، إِلَّا مَنْ أَتَى اللهَ بِقَلْبٍ سَلِيمٍ.
إِلَهِي، لَا تَجْعَلْنِي مِنَ الْمَغْضُوبِ عَلَيْهِمْ وَلَا مِنَ الضَّالِّينَ.`},

{id:51,title:"دعاء التذلل والخشوع",text:`إِلَهِي، عَبْدُكَ بِفِنَائِكَ، مِسْكِينُكَ بِفِنَائِكَ، فَقِيرُكَ بِفِنَائِكَ، سَائِلُكَ بِفِنَائِكَ.
إِلَهِي، لَا تَحْجُبْ دُعَائِي، وَلَا تَرُدَّ سُؤَالِي، وَلَا تُخَيِّبْ رَجَائِي.
إِلَهِي، انْظُرْ إِلَيَّ نَظْرَةً رَحِيمَةً تَكْفِينِي بِهَا فِي الدُّنْيَا وَالْآخِرَةِ.
إِلَهِي، أَنْتَ أَعْلَمُ بِحَالِي مِنْ نَفْسِي، وَأَنْتَ أَرْحَمُ بِي مِنِّي.
إِلَهِي، لَا تُقَنِّطْنِي مِنْ رَحْمَتِكَ، وَلَا تُيْئِسْنِي مِنْ رَوْحِكَ.`},

{id:52,title:"دعاء الإلحاح على الله",text:`إِلَهِي، أَسْأَلُكَ وَلَا أَسْأَلُ غَيْرَكَ، وَأَطْلُبُ مِنْكَ وَلَا أَطْلُبُ مِنْ سِوَاكَ.
إِلَهِي، أَلِحُّ عَلَيْكَ فِي الدُّعَاءِ، فَإِنَّكَ أَحْبَبْتَ إِلْحَاحَ الْمُلِحِّينَ.
إِلَهِي، إِنَّكَ قُلْتَ: ﴿ادْعُونِي أَسْتَجِبْ لَكُمْ﴾، وَهَا أَنَا أَدْعُوكَ فَاسْتَجِبْ لِي.
إِلَهِي، إِنَّكَ قُلْتَ: ﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ﴾، فَهَا أَنَا أَسْأَلُكَ فَأَجِبْنِي.
إِلَهِي، لَا تَرُدَّنِي خَائِباً، فَإِنَّكَ لَا تُخَيِّبُ مَنْ دَعَاكَ.`},

{id:53,title:"دعاء التضرع",text:`إِلَهِي، إِلَيْكَ تَضَرَّعْتُ، وَبِبَابِكَ وَقَفْتُ، وَمِنْكَ رَجَوْتُ، وَعَلَيْكَ تَوَكَّلْتُ.
إِلَهِي، إِنِّي عَبْدُكَ الذَّلِيلُ الْحَقِيرُ، الْفَقِيرُ الْخَطِيرُ.
إِلَهِي، لَا تَرُدَّ يَدِي صِفْراً مِنْ خَيْرِكَ، وَلَا تُخَيِّبْ فِيكَ أَمَلِي.
إِلَهِي، بِحَقِّ أَسْمَائِكَ الْحُسْنَى، وَصِفَاتِكَ الْعُلْيَا، أَسْأَلُكَ أَنْ تَغْفِرَ لِي وَتَرْحَمَنِي.
إِلَهِي، مَا خَابَ عَبْدٌ تَضَرَّعَ إِلَيْكَ، وَلَا رُدَّ سَائِلٌ سَأَلَكَ، وَلَا ضَاعَ عَبْدٌ لَجَأَ إِلَيْكَ.`},

{id:54,title:"دعاء التواضع وإظهار الفقر إلى الله",text:`إِلَهِي، أَنَا الْفَقِيرُ الَّذِي لَا يَسْتَغْنِي عَنْكَ، وَأَنَا الذَّلِيلُ الَّذِي لَا يَعْتَزُّ إِلَّا بِكَ.
إِلَهِي، إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ.
إِلَهِي، أَنْتَ الْغَنِيُّ وَأَنَا الْفَقِيرُ، أَنْتَ الْقَوِيُّ وَأَنَا الضَّعِيفُ، أَنْتَ الْحَيُّ وَأَنَا الْمَيِّتُ.
إِلَهِي، لَا أَمْلِكُ لِنَفْسِي نَفْعاً وَلَا ضَرّاً وَلَا مَوْتاً وَلَا حَيَاةً وَلَا نُشُوراً.
إِلَهِي، فَقْدِي لِحِيلَتِي، وَعَجْزِي عَنْ طَاعَتِكَ، وَإِعْرَاضِي عَنْ ذِكْرِكَ، كُلُّ ذَلِكَ يَشْهَدُ أَنِّي عَبْدُكَ الْفَقِيرُ إِلَيْكَ.
اللَّهُمَّ فَأَغْنِنِي بِفَضْلِكَ، وَأَعِزَّنِي بِعِزَّتِكَ، وَأَحْيِنِي بِرَحْمَتِكَ، وَارْحَمْنِي بِمَغْفِرَتِكَ.
وَصَلَّى اللهُ عَلَى مُحَمَّدٍ وَآلِهِ الطَّاهِرِينَ.`}
];

// ================= منطق التطبيق =================
let fsIdx = 0;

document.addEventListener('DOMContentLoaded', () => {
    render(SAHIFA);
});

function render(data) {
    const c = document.getElementById('app');
    let h = '';
    data.forEach((d, i) => {
        const prev = d.text.substring(0,120) + '...';
        h += `<div class="card" onclick="openR(${i})">
            <div class="num">الدعاء ${d.id}</div>
            <div class="title">${d.title}</div>
            <div class="preview">${prev}</div>
        </div>`;
    });
    c.innerHTML = h;
}

function openR(i) {
    // البحث عن الدعاء الأصلي باستخدام المعرف
    const originalIndex = SAHIFA.findIndex(d => d.id === SAHIFA[i]?.id || d === SAHIFA[i]);
    const d = SAHIFA[originalIndex !== -1 ? originalIndex : i];
    
    const m = document.getElementById('modal');
    document.getElementById('mTitle').textContent = `الدعاء ${d.id}: ${d.title}`;
    
    let txt = d.text.replace(/\n/g, '<br>');
    if (!txt.includes('<p>')) txt = `<p>${txt}</p>`;
    
    document.getElementById('mText').innerHTML = txt;
    m.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeM() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
}

function chgFont() {
    const m = document.getElementById('modal');
    const cls = ['','fs-1','fs-2','fs-3'];
    m.classList.remove(...cls);
    fsIdx = (fsIdx + 1) % cls.length;
    if (cls[fsIdx]) m.classList.add(cls[fsIdx]);
}

document.getElementById('search').addEventListener('input', e => {
    const t = e.target.value.trim().toLowerCase();
    if (!t) return render(SAHIFA);
    const f = SAHIFA.filter(d => 
        d.title.toLowerCase().includes(t) || 
        d.text.toLowerCase().includes(t)
    );
    render(f);
});

document.addEventListener('keydown', e => { if(e.key==='Escape') closeM(); });
</script>
</body>
